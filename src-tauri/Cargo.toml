[package]
name = "iakaagentsmonitor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Moniteur de barre de menus : agents Claude Code en cours (persona, projet, tache, parente, activite)."

[lib]
name = "iakaagentsmonitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "iakaagentsmonitor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
toml = "0.8"
# Vivacité d'un pid (`kill(pid, 0)`, sous cfg(unix)) : déjà dans l'arbre de Tauri, rendue directe
# et explicite (ce-poste-vue-locale-lisibilite.md D1).
libc = "0.2"

[dev-dependencies]
rumqttd = "0.19"
