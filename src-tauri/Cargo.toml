[package]
name = "iakaagentsmonitor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Moniteur de barre de menus : agents Claude Code en cours (persona, projet, tache, parente, activite)."

[lib]
name = "iakaagentsmonitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "iakaagentsmonitor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
