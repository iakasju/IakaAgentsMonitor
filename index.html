<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IakaAgentsMonitor</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Applique la bascule manuelle mémorisée AVANT le premier rendu (pas de flash de thème,
         amendement A3 point 1). Sans préférence mémorisée -> suit macOS (media query CSS). -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("iakaam-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
          // Cran de taille du texte (14 / 16 / 18 px, défaut m = 16 px) : appliqué aussi AVANT le
          // premier rendu, pour ne pas voir la fenêtre changer de taille au démarrage.
          var size = localStorage.getItem("iakaam-size");
          document.documentElement.setAttribute("data-size", size === "s" || size === "l" ? size : "m");
        } catch (e) {
          /* localStorage indisponible : on suit simplement macOS. */
        }
      })();
    </script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand">IakaAgentsMonitor</span>
      <span class="topbar-right">
        <span id="count" class="count"></span>
        <span id="sizeSeg" class="seg" role="group" aria-label="Taille du texte">
          <button type="button" class="seg-s" data-size="s" title="Texte 14 px" aria-label="Texte 14 px">A</button>
          <button type="button" class="seg-m" data-size="m" title="Texte 16 px (par défaut)" aria-label="Texte 16 px">A</button>
          <button type="button" class="seg-l" data-size="l" title="Texte 18 px" aria-label="Texte 18 px">A</button>
        </span>
        <button
          id="expandBtn"
          class="theme-btn"
          type="button"
          title="Agrandir (tableau complet)"
        >
          ⤢
        </button>
        <button id="themeBtn" class="theme-btn" type="button" title="Basculer le thème">☾/☀</button>
      </span>
    </header>
    <section id="agents" class="agents"></section>
    <!-- « Autres machines » : vue distante (central), absente tant qu'aucun central n'est configuré. -->
    <section id="fleet" class="fleet" hidden></section>
    <footer class="footbar">
      <span>tick 5 s</span>
      <span>seuil 90 s</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
